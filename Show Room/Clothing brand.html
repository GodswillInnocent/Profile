<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>3‑Color Guess Game</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 580px; margin: 2rem auto; }
    .row { display: flex; gap: .5rem; margin: .75rem 0; flex-wrap: wrap; }
    button { padding: .7rem 1rem; border: 1px solid #ccc; border-radius: .5rem; cursor: pointer; }
    #log { white-space: pre-wrap; border: 1px solid #eee; padding: 1rem; border-radius: .5rem; min-height: 6rem; }
    .pill { display:inline-block; padding:.15rem .5rem; border:1px solid #ddd; border-radius:999px; margin-right:.25rem; }
  </style>
</head>
<body>
  <h1>3‑Color Guess Game</h1>

  <div>Last 3: <span id="last3"></span></div>

  <div class="row">
    <button data-color="yellow">Yellow</button>
    <button data-color="red">Red</button>
    <button data-color="blue">Blue</button>
  </div>

  <div class="row">
    <label>Repeat probability q: <input id="q" type="number" min="0" max="1" step="0.01" value="0.15"></label>
    <label>Special p: <input id="p" type="number" min="0" max="1" step="0.01" value="1.0"></label>
  </div>

  <div id="log"></div>

  <script>
    const COLORS = ["yellow","red","blue"];
    const rng = (() => {
      let s = 123456789;
      return () => (s = (1103515245*s + 12345) & 0x7fffffff) / 0x80000000; // simple LCG
    })();

    let last = null;
    let history = [];
    let cooldown = 1, cdLeft = 0;

    function last3() { return history.slice(-3); }
    function tripleReady() {
      const l3 = last3();
      return l3.length === 3 && new Set(l3).size === 1;
    }

    function basePick(q) {
      if (last === null) return COLORS[Math.floor(rng()*3)];
      if (rng() < q) return last;
      const others = COLORS.filter(c => c !== last);
      return others[Math.floor(rng()*2)];
    }

    function nextColor(q, pSpecial) {
      if (cdLeft === 0 && tripleReady() && rng() < pSpecial) {
        const c = last3()[0];
        last = c; history.push(c); cdLeft = cooldown; return c;
      }
      const c = basePick(q);
      last = c; history.push(c);
      if (cdLeft > 0) cdLeft--;
      return c;
    }

    function renderLast3() {
      const el = document.getElementById("last3");
      el.innerHTML = "";
      last3().forEach(c => {
        const span = document.createElement("span");
        span.className = "pill";
        span.textContent = c;
        el.appendChild(span);
      });
    }

    function log(line) {
      const el = document.getElementById("log");
      el.textContent = line + "\n" + el.textContent;
    }

    function round(guess) {
      const q = parseFloat(document.getElementById("q").value || "0.15");
      const p = parseFloat(document.getElementById("p").value || "1.0");
      const answer = nextColor(q, p);
      const ok = (guess === answer);
      log((ok ? "✅" : "❌") + ` You guessed ${guess}. It was ${answer}.`);
      renderLast3();
    }

    document.querySelectorAll("button[data-color]").forEach(btn => {
      btn.addEventListener("click", () => round(btn.dataset.color));
    });

    // seed with a few rounds so there's something to look at
    for (let i=0;i<5;i++) nextColor(0.15, 1.0);
    renderLast3();
  </script>
</body>
</html>
